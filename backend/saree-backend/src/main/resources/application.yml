server:
  port: ${PORT:8080}

spring:
  application:
    name: saree-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/saree_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      validation-timeout: 5000
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 1200000
      keepalive-time: 300000
      initialization-fail-timeout: 60000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    fail-on-missing-locations: true

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:my-local-secret-key-that-is-at-least-256-bits-long-for-hs256!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  storage:
    # Local disk directory for image uploads (served publicly at /uploads/**).
    # Override with APP_STORAGE_DIR env var. No third-party storage is used.
    dir: ${APP_STORAGE_DIR:./uploads}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
